[workspace]
members = ["crates/mcdh-core", "crates/mcdh-plugins", "crates/mcdh-mcp", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.4.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
fs2 = "0.4"
encoding_rs = "0.8"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }
jsonschema = { version = "0.33", default-features = false }
percent-encoding = "2"
rquickjs = { version = "=0.14.0", features = ["loader", "futures"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls-no-alpn"] }
rmcp = { version = "3.1.2", features = ["transport-io"] }
schemars = "1"
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
walkdir = "2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes"] }
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
